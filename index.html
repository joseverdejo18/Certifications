<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AB-620 Simulacro</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2330;--mut:#667085;--bd:#d9dfe9;--pri:#2563eb;--ok:#16a34a;--ko:#dc2626;--okb:#e8f7ee;--kob:#fdecec;--warn:#d97706}
:root[data-theme=dark]{--bg:#10151f;--card:#18202e;--tx:#e6ebf4;--mut:#9aa6ba;--bd:#2c3749;--pri:#5b8cff;--okb:#12301f;--kob:#3a1a1a;color-scheme:dark}
#theme{position:fixed;top:10px;right:12px;z-index:9;border-radius:99px;padding:6px 12px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
.mut{color:var(--mut)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 14px}
button:hover{border-color:var(--pri)}button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{padding:8px 16px;border-radius:99px}.chip.sel{background:var(--pri);color:#fff;border-color:var(--pri)}
input[type=number]{width:90px;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
label.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;max-height:130px;overflow:auto;padding:6px 4px 0}
.gn{width:34px;height:34px;padding:0;border-radius:6px;font-size:13px;position:relative}
.gn.done{background:var(--pri);color:#fff;border-color:var(--pri)}.gn.cur{outline:2px solid var(--warn)}
.gn.flag::after{content:"⚑";position:absolute;top:-6px;right:-3px;font-size:12px;color:var(--warn)}
.gn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.gn.ko{background:var(--ko);color:#fff;border-color:var(--ko)}
.qtext{font-size:16px;margin:8px 0 14px}.qtext p,.case p,.expl p{margin:0 0 .7em}.hd{font-weight:700;margin-top:.9em!important}.bl{position:relative;padding-left:20px;margin:0 0 .35em}.bl::before{content:'•';position:absolute;left:6px;color:var(--pri)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,transparent)}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ko{border-color:var(--ko);background:var(--kob)}
.opt input{margin-top:4px}.k{font-weight:700;min-width:18px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);margin-right:6px;color:var(--mut)}
.bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px}
details.case{border:1px solid var(--bd);border-radius:8px;padding:8px 12px;margin-bottom:12px;background:color-mix(in srgb,var(--pri) 5%,transparent)}
details.case summary{cursor:pointer;font-weight:600}details.case div{margin-top:8px;max-height:340px;overflow:auto;font-size:14px}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.dd{grid-template-columns:1fr}}
.pool,.slotbox{min-height:50px;border:2px dashed var(--bd);border-radius:8px;padding:8px}
.pool.over,.slotbox.over{border-color:var(--pri)}
.item{background:var(--card);border:1px solid var(--pri);border-radius:6px;padding:8px 10px;margin:5px 0;cursor:grab;user-select:none}
.item.picked{background:var(--pri);color:#fff}
.slotrow{display:flex;gap:8px;margin:6px 0;align-items:stretch}
.slotrow .num{min-width:28px;text-align:center;border:1px solid var(--bd);border-radius:6px;padding:8px 0;font-weight:700}
.slotrow .slotbox{flex:1}.slotlabel{font-weight:600;margin-bottom:4px}
table.hs{width:100%;border-collapse:collapse}table.hs td{padding:8px;border-bottom:1px solid var(--bd);vertical-align:middle}
select{padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);max-width:100%}
.res{border-left:4px solid var(--bd)}.res.ok{border-left-color:var(--ok)}.res.ko{border-left-color:var(--ko)}
.expl{background:var(--bg);border-radius:8px;padding:10px;margin-top:10px;font-size:14px}
.big{font-size:42px;font-weight:700}.ok-t{color:var(--ok)}.ko-t{color:var(--ko)}
.ans{margin:8px 0;padding:8px 10px;border-radius:8px;font-size:14px}.ans.c{background:var(--okb)}.ans.u{background:var(--kob)}
.hide{display:none}.note{font-size:12px;color:var(--warn)}
</style>
</head>
<body>
<script>
(function(){var t='dark';try{t=localStorage.getItem('ab620_theme')||'dark'}catch(e){}document.documentElement.dataset.theme=t;})();
</script>
<button id="theme" onclick="(function(){var r=document.documentElement,t=r.dataset.theme==='dark'?'light':'dark';r.dataset.theme=t;try{localStorage.setItem('ab620_theme',t)}catch(e){}document.getElementById('theme').textContent=t==='dark'?'☀ Claro':'🌙 Oscuro'})()">☀ Claro</button>
<div class="wrap" id="app"></div>
<script src="data.js"></script>
<script>
(function(){
const $app=document.getElementById('app');
const ALL=(window.QUESTIONS||[]).filter(q=>q.type!=='missing'&&(q.type==='hotspot'||q.answer!=null)&&(q.type!=='hotspot'||q.rows)&&((q.type!=='order'&&q.type!=='match')||q.items));
const LS='ab620_v1';
let store={attempts:[],wrong:[]};
try{store=Object.assign(store,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(store))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>String(t||'').split('\n').map(l=>l.startsWith('• ')?`<div class="bl">${esc(l.slice(2))}</div>`:l.startsWith('§ ')?`<p class="hd">${esc(l.slice(2))}</p>`:`<p>${esc(l)}</p>`).join('');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const TL={single:'Opción única',multi:'Selección múltiple',order:'Drag & Drop (ordenar)',match:'Drag & Drop (emparejar)',hotspot:'Hotspot'};
let S=null; // session

/* ---------- SETUP ---------- */
function setup(){
  const w=store.wrong.filter(id=>ALL.some(q=>q.id===id)).length;
  const cnts=[10,20,25,30,50];
  $app.innerHTML=`<div class="card"><h1>AB-620 · Simulacro de examen</h1>
  <div class="mut">Designing and Building Integrated AI Agent Solutions in Copilot Studio · ${ALL.length} preguntas disponibles</div></div>
  <div class="card"><h2>Número de preguntas</h2>
  <div class="chips" id="cnt">${cnts.map(n=>`<button class="chip ${n===20?'sel':''}" data-n="${n}">${n}</button>`).join('')}<button class="chip" data-n="${ALL.length}">Todas (${ALL.length})</button></div>
  <label class="row">Personalizado: <input type="number" id="custom" min="1" max="${ALL.length}" placeholder="N"></label>
  <h2>Opciones</h2>
  <label class="row"><input type="checkbox" id="rnd" checked> Orden aleatorio</label>
  <label class="row"><input type="checkbox" id="nocase"> Excluir Case Studies</label>
  <label class="row"><input type="checkbox" id="onlywrong" ${w?'':'disabled'}> Solo preguntas falladas anteriormente (${w})</label>
  <div class="bar"><span class="mut">Tipos: ${Object.entries(TL).map(([k,v])=>`<span class="tag">${v}: ${ALL.filter(q=>q.type===k).length}</span>`).join('')}</span>
  <button class="pri" id="go">Empezar simulacro</button></div></div>
  <div class="card"><h2>Historial</h2>${histHTML()}
  ${store.attempts.length?'<button id="clr">Borrar historial</button>':''}</div>`;
  let n=20;
  document.querySelectorAll('#cnt .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#cnt .chip').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');n=+b.dataset.n;document.getElementById('custom').value=''});
  document.getElementById('custom').oninput=e=>{if(e.target.value){document.querySelectorAll('#cnt .chip').forEach(x=>x.classList.remove('sel'));n=Math.max(1,Math.min(ALL.length,+e.target.value))}};
  document.getElementById('go').onclick=()=>{
    let pool=ALL.slice();
    if(document.getElementById('nocase').checked)pool=pool.filter(q=>!q.case);
    if(document.getElementById('onlywrong').checked)pool=pool.filter(q=>store.wrong.includes(q.id));
    if(!pool.length)return alert('No hay preguntas con esos filtros.');
    if(document.getElementById('rnd').checked)pool=shuffle(pool);
    start(pool.slice(0,Math.min(n,pool.length)));
  };
  const c=document.getElementById('clr');if(c)c.onclick=()=>{if(confirm('¿Borrar historial y falladas?')){store={attempts:[],wrong:[]};save();setup()}};
}
function histHTML(){
  if(!store.attempts.length)return '<div class="mut">Aún no hay intentos.</div>';
  return '<table class="hs">'+store.attempts.slice(-10).reverse().map(a=>`<tr><td>${esc(a.date)}</td><td>${a.correct}/${a.total}</td><td><b class="${a.pct>=70?'ok-t':'ko-t'}">${a.pct}%</b></td></tr>`).join('')+'</table>';
}

/* ---------- SESSION ---------- */
function start(qs){
  S={qs:qs.map(q=>prep(q)),ans:{},flag:{},i:0,done:false};
  render();
}
function prep(q){
  const p=Object.assign({},q);
  if(q.type==='order')p._items=shuffle(q.items);
  if(q.type==='match')p._items=shuffle(q.items);
  if(q.type==='hotspot')p._rows=q.rows;
  return p;
}
const getA=q=>S.ans[q.id];
function answered(q){
  const a=getA(q);if(a==null)return false;
  if(q.type==='single'||q.type==='multi')return a.length>0;
  if(q.type==='order')return a.length>0;
  if(q.type==='match')return a.some(x=>x&&x.length);
  if(q.type==='hotspot')return a.some(x=>x!=null&&x!=='');
  return false;
}
function nav(review){
  return `<div class="grid">${S.qs.map((q,i)=>{
    let c='gn';if(i===S.i)c+=' cur';
    if(review){c+=q._ok?' ok':' ko'}else{if(answered(q))c+=' done';if(S.flag[q.id])c+=' flag'}
    return `<button class="${c}" data-i="${i}">${i+1}</button>`}).join('')}</div>`;
}
function render(){
  if(S.done)return renderRes();
  const q=S.qs[S.i];
  $app.innerHTML=`<div class="card">
  <div class="bar" style="margin:0 0 10px"><b>Pregunta ${S.i+1} de ${S.qs.length}</b>
  <span><span class="tag">${TL[q.type]}</span>${q.case?'<span class="tag">Case Study</span>':''}<span class="tag">#${q.id}</span></span></div>
  ${nav(false)}
  ${q.case&&window.CASES[q.case]?`<details class="case" ${S.caseOpen===q.case?'open':''}><summary>Ver enunciado del caso</summary><div>${fmt(window.CASES[q.case])}</div></details>`:''}
  <div class="qtext">${fmt(q.text)}</div>
  ${q.type==='multi'?`<div class="mut" style="margin-bottom:6px">Selecciona ${q.answer.length} respuestas.</div>`:''}
  <div id="ctl"></div>
  <div style="margin-top:12px"><button id="chk">${S.checked&&S.checked[q.id]?'Ocultar comprobación':'✔ Comprobar respuesta'}</button></div>
  ${S.checked&&S.checked[q.id]?(()=>{const ok=grade(q);return `<div class="ans ${ok?'c':'u'}" style="margin-top:10px"><b>${answered(q)?(ok?'✔ Correcta':'✘ Incorrecta'):'Aún no has respondido'}</b>${ok?'':`<div style="margin-top:6px"><b>Respuesta correcta</b>${ansText(q,false)}</div>`}${q.expl?`<div class="expl"><b>Explicación</b>${fmt(q.expl)}</div>`:''}</div>`})():''}
  <div class="bar"><span><button id="prev" ${S.i?'':'disabled'}>← Anterior</button> <button id="fl">${S.flag[q.id]?'Quitar marca ⚑':'Marcar ⚑'}</button></span>
  <span>${S.i<S.qs.length-1?'<button id="next" class="pri">Siguiente →</button>':''} <button id="fin" class="${S.i===S.qs.length-1?'pri':''}">Finalizar</button></span></div></div>`;
  const det=document.querySelector('details.case');if(det)det.ontoggle=()=>{S.caseOpen=det.open?q.case:null};
  document.querySelectorAll('.gn').forEach(b=>b.onclick=()=>{S.i=+b.dataset.i;render()});
  document.getElementById('prev').onclick=()=>{S.i--;render()};
  const nx=document.getElementById('next');if(nx)nx.onclick=()=>{S.i++;render()};
  document.getElementById('chk').onclick=()=>{S.checked=S.checked||{};S.checked[q.id]=!S.checked[q.id];render()};
  document.getElementById('fl').onclick=()=>{S.flag[q.id]=!S.flag[q.id];render()};
  document.getElementById('fin').onclick=()=>{
    const un=S.qs.filter(x=>!answered(x)).length;
    if(un&&!confirm(`Tienes ${un} pregunta(s) sin responder. ¿Finalizar?`))return;
    finish()};
  const ctl=document.getElementById('ctl');
  ({single:ctlChoice,multi:ctlChoice,order:ctlOrder,match:ctlMatch,hotspot:ctlHot})[q.type](q,ctl,false);
}

/* ---------- CONTROLS ---------- */
function ctlChoice(q,el,ro){
  const a=ro?(S.ans[q.id]||[]):(getA(q)||[]);
  el.innerHTML=q.options.map(o=>{
    let c='opt';const sel=a.includes(o.k);
    if(ro){if(q.answer.includes(o.k))c+=' ok';else if(sel)c+=' ko'}else if(sel)c+=' sel';
    return `<label class="${c}"><input type="${q.type==='multi'?'checkbox':'radio'}" name="o" value="${o.k}" ${sel?'checked':''} ${ro?'disabled':''}><span class="k">${o.k}.</span><span>${esc(o.t)}</span></label>`}).join('');
  if(ro)return;
  el.querySelectorAll('input').forEach(inp=>inp.onchange=()=>{
    let cur=getA(q)||[];
    if(q.type==='multi'){cur=inp.checked?[...cur,inp.value]:cur.filter(x=>x!==inp.value)}else cur=[inp.value];
    S.ans[q.id]=cur;render();
  });
}
function dragWire(el,onDrop){
  el.querySelectorAll('[draggable=true]').forEach(it=>{
    it.ondragstart=e=>{e.dataTransfer.setData('text/plain',JSON.stringify({from:it.dataset.from,idx:+it.dataset.idx}));e.dataTransfer.effectAllowed='move'};
  });
  el.querySelectorAll('[data-drop]').forEach(z=>{
    z.ondragover=e=>{e.preventDefault();z.classList.add('over')};
    z.ondragleave=()=>z.classList.remove('over');
    z.ondrop=e=>{e.preventDefault();z.classList.remove('over');let d;try{d=JSON.parse(e.dataTransfer.getData('text/plain'))}catch(x){return}onDrop(d,z.dataset.drop,e,z)};
  });
}
function ctlOrder(q,el){
  const cur=getA(q)||[];
  const pool=q._items.filter(x=>!cur.includes(x));
  el.innerHTML=`<div class="mut" style="margin-bottom:6px">Arrastra (o haz clic) las acciones al área de respuesta y ordénalas. Clic en una acción colocada para devolverla.</div>
  <div class="dd"><div><div class="slotlabel">Acciones disponibles</div><div class="pool" data-drop="pool">${pool.map(x=>`<div class="item" draggable="true" data-from="pool" data-idx="${q._items.indexOf(x)}">${esc(x)}</div>`).join('')}</div></div>
  <div><div class="slotlabel">Área de respuesta</div><div class="pool" data-drop="ans">${cur.map((x,i)=>`<div class="item" draggable="true" data-from="ans" data-idx="${i}"><b>${i+1}.</b> ${esc(x)}</div>`).join('')||'<span class="mut">Suelta aquí</span>'}</div></div></div>`;
  const set=a=>setAns(q,a);
  addTools(q,el);
  el.querySelectorAll('[data-from=pool]').forEach(it=>it.onclick=()=>set([...cur,q._items[+it.dataset.idx]]));
  el.querySelectorAll('[data-from=ans]').forEach(it=>it.onclick=()=>set(cur.filter((_,i)=>i!==+it.dataset.idx)));
  dragWire(el,(d,zone,e,z)=>{
    let a=cur.slice();
    if(d.from==='pool'){
      const item=q._items[d.idx];if(zone!=='ans')return;
      let pos=a.length;const t=e.target.closest('[data-from=ans]');if(t)pos=+t.dataset.idx;
      a.splice(pos,0,item);
    }else{
      const item=a[d.idx];a.splice(d.idx,1);
      if(zone==='pool'){set(a);return}
      let pos=a.length;const t=e.target.closest('[data-from=ans]');if(t)pos=+t.dataset.idx;
      a.splice(pos,0,item);
    }
    set(a);
  });
}
function setAns(q,val){
  S.hist=S.hist||{};(S.hist[q.id]=S.hist[q.id]||[]).push(S.ans[q.id]===undefined?null:JSON.stringify(S.ans[q.id]));
  S.ans[q.id]=val;render();
}
function addTools(q,el){
  const h=(S.hist&&S.hist[q.id])||[];
  const d=document.createElement('div');d.className='bar';d.style.marginTop='10px';
  d.innerHTML=`<span><button id="undo" ${h.length?'':'disabled'}>↶ Deshacer</button> <button id="reset" ${answered(q)?'':'disabled'}>Reiniciar</button></span>`;
  el.appendChild(d);
  d.querySelector('#undo').onclick=()=>{const p=h.pop();if(p==null)delete S.ans[q.id];else S.ans[q.id]=JSON.parse(p);S.pick=null;render()};
  d.querySelector('#reset').onclick=()=>{S.hist[q.id]=[];delete S.ans[q.id];S.pick=null;render()};
}
function capOf(q,i){const x=q.answer[i];return Array.isArray(x)?x.length:1}
function ctlMatch(q,el){
  let cur=getA(q);if(!cur)cur=q.slots.map(()=>[]);
  const used=new Set(cur.flat());
  const pool=q.reuse?q._items:q._items.filter(x=>!used.has(x));
  el.innerHTML=`<div class="mut" style="margin-bottom:6px">Arrastra cada elemento a su casilla (o haz clic en el elemento y luego en la casilla). Clic en un elemento colocado para quitarlo.</div>
  <div class="dd"><div><div class="slotlabel">Elementos</div><div class="pool" data-drop="pool">${pool.map(x=>`<div class="item ${S.pick===x?'picked':''}" draggable="true" data-from="pool" data-v="${esc(x)}" data-idx="${q._items.indexOf(x)}">${esc(x)}</div>`).join('')}</div></div>
  <div>${q.slots.map((s,i)=>`<div style="margin-bottom:8px"><div class="slotlabel">${esc(s)}</div><div class="slotbox" data-drop="${i}">${cur[i].map((x,j)=>`<div class="item" draggable="true" data-from="slot${i}" data-idx="${j}">${esc(x)}</div>`).join('')||'<span class="mut">Suelta aquí</span>'}</div></div>`).join('')}</div></div>`;
  const place=(item,i,fromSlot)=>{
    const a=cur.map(x=>x.slice());
    if(fromSlot!=null)a[fromSlot.s].splice(fromSlot.j,1);
    if(!q.reuse)a.forEach(x=>{const k=x.indexOf(item);if(k>=0)x.splice(k,1)});
    if(a[i].includes(item)){setAns(q,a);return}
    if(a[i].length>=capOf(q,i))a[i].shift();
    a[i].push(item);S.pick=null;setAns(q,a);
  };
  addTools(q,el);
  el.querySelectorAll('[data-from=pool]').forEach(it=>it.onclick=()=>{S.pick=S.pick===it.dataset.v?null:it.dataset.v;render()});
  el.querySelectorAll('[data-from^=slot]').forEach(it=>it.onclick=()=>{const i=+it.dataset.from.slice(4),j=+it.dataset.idx;const a=cur.map(x=>x.slice());a[i].splice(j,1);setAns(q,a)});
  el.querySelectorAll('.slotbox').forEach(z=>{const prev=z.onclick;z.addEventListener('click',e=>{if(e.target.closest('.item'))return;if(S.pick)place(S.pick,+z.dataset.drop)})});
  dragWire(el,(d,zone)=>{
    if(zone==='pool'){if(d.from.startsWith('slot')){const i=+d.from.slice(4);const a=cur.map(x=>x.slice());a[i].splice(d.idx,1);setAns(q,a)}return}
    const i=+zone;
    if(d.from==='pool')place(q._items[d.idx],i);
    else{const si=+d.from.slice(4);place(cur[si][d.idx],i,{s:si,j:d.idx})}
  });
}
function ctlHot(q,el,ro){
  const a=getA(q)||[];
  el.innerHTML=`<table class="hs">${q.rows.map((r,i)=>`<tr><td>${esc(r.label)}</td><td><select data-i="${i}"><option value="">— Selecciona —</option>${r.options.map((o,j)=>`<option value="${j}" ${a[i]===j?'selected':''}>${esc(o)}</option>`).join('')}</select></td></tr>`).join('')}</table>`;
  el.querySelectorAll('select').forEach(s=>s.onchange=()=>{const x=(getA(q)||q.rows.map(()=>null)).slice();x[+s.dataset.i]=s.value===''?null:+s.value;S.ans[q.id]=x;render()});
}

/* ---------- GRADING ---------- */
function grade(q){
  const a=S.ans[q.id];
  if(!answered(q))return false;
  if(q.type==='single'||q.type==='multi')return a.length===q.answer.length&&q.answer.every(x=>a.includes(x));
  if(q.type==='order')return a.length===q.answer.length&&a.every((x,i)=>x===q.answer[i]);
  if(q.type==='match')return q.slots.every((_,i)=>{const e=[].concat(q.answer[i]||[]),g=a[i]||[];return e.length===g.length&&e.every(x=>g.includes(x))});
  if(q.type==='hotspot')return q.rows.every((r,i)=>a[i]===r.answer);
  return false;
}
function finish(){
  let c=0;S.qs.forEach(q=>{q._ok=grade(q);if(q._ok)c++;
    const k=store.wrong.indexOf(q.id);if(q._ok&&k>=0)store.wrong.splice(k,1);if(!q._ok&&k<0)store.wrong.push(q.id)});
  const pct=Math.round(100*c/S.qs.length);
  store.attempts.push({date:new Date().toLocaleString('es-ES'),correct:c,total:S.qs.length,pct});
  save();S.done=true;S.i=0;S.score={c,pct};S.filter='all';render();
}

/* ---------- RESULTS ---------- */
function ansText(q,user){
  const a=user?S.ans[q.id]:null;
  if(q.type==='single'||q.type==='multi'){
    const L=user?(a||[]):q.answer;if(!L.length)return '<i>Sin responder</i>';
    return L.slice().sort().map(k=>{const o=q.options.find(o=>o.k===k);return `<div><b>${k}.</b> ${esc(o?o.t:'')}</div>`}).join('');
  }
  if(q.type==='order'){const L=user?(a||[]):q.answer;if(!L.length)return '<i>Sin responder</i>';return L.map((x,i)=>`<div><b>${i+1}.</b> ${esc(x)}</div>`).join('')}
  if(q.type==='match')return q.slots.map((s,i)=>{const v=user?((a&&a[i])||[]):[].concat(q.answer[i]||[]);return `<div><b>${esc(s)}</b> → ${v.length?v.map(esc).join(' + '):'<i>—</i>'}</div>`}).join('');
  if(q.type==='hotspot')return q.rows.map((r,i)=>{const j=user?(a&&a[i]):r.answer;return `<div><b>${esc(r.label)}</b> → ${j==null?'<i>—</i>':esc(r.options[j])}</div>`}).join('');
  return '';
}
function renderRes(){
  const {c,pct}=S.score;const pass=pct>=70;
  const list=S.qs.map((q,i)=>({q,i})).filter(({q})=>S.filter==='all'||(S.filter==='ko'&&!q._ok));
  $app.innerHTML=`<div class="card" style="text-align:center"><div class="big ${pass?'ok-t':'ko-t'}">${pct}%</div>
  <div>${c} de ${S.qs.length} correctas · ${pass?'Aprobado (≥70%)':'No alcanzas el 70%'}</div>
  <div class="bar" style="justify-content:center"><button id="all" class="${S.filter==='all'?'pri':''}">Ver todas</button><button id="ko" class="${S.filter==='ko'?'pri':''}">Solo falladas (${S.qs.length-c})</button><button id="new">Nuevo simulacro</button></div></div>
  <div class="card">${nav(true)}</div>
  ${list.map(({q,i})=>`<div class="card res ${q._ok?'ok':'ko'}" id="r${i}">
  <div class="bar" style="margin:0 0 8px"><b>${i+1}. ${q._ok?'✔ Correcta':'✘ Incorrecta'}</b><span><span class="tag">${TL[q.type]}</span><span class="tag">#${q.id}</span></span></div>
  ${q.case&&window.CASES[q.case]?`<details class="case"><summary>Ver enunciado del caso</summary><div>${fmt(window.CASES[q.case])}</div></details>`:''}
  <div class="qtext">${fmt(q.text)}</div>
  ${(q.type==='single'||q.type==='multi')?'<div id="o'+i+'"></div>':''}
  ${(q.type==='single'||q.type==='multi')?'':`<div class="ans u"><b>Tu respuesta</b>${ansText(q,true)}</div>`}
  <div class="ans c"><b>Respuesta correcta</b>${ansText(q,false)}</div>
  ${q.note?`<div class="note">Nota de transcripción: ${esc(q.note)}</div>`:''}
  ${q.expl?`<div class="expl"><b>Explicación</b>${fmt(q.expl)}</div>`:''}</div>`).join('')}`;
  S.qs.forEach((q,i)=>{const el=document.getElementById('o'+i);if(el)ctlChoice(q,el,true)});
  document.getElementById('all').onclick=()=>{S.filter='all';renderRes()};
  document.getElementById('ko').onclick=()=>{S.filter='ko';renderRes()};
  document.getElementById('new').onclick=()=>{S=null;setup()};
  document.querySelectorAll('.gn').forEach(b=>b.onclick=()=>{S.filter='all';renderRes();document.getElementById('r'+b.dataset.i).scrollIntoView({behavior:'smooth'})});
}
setup();
})();
</script>
